<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金龍追珠</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: a full-screen lacquer stage; title top-left, camera preview bottom-right, one control bar. Single dark look. */
:root {
  --lacquer: #120806; --lacquer-2: #2a120b; --gold: #e3b25a; --gold-dim: #9c7637;
  --ink: #f3e6cf; --muted: #b39c80;
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(ellipse at 50% 45%, var(--lacquer-2) 0%, var(--lacquer) 72%); color: var(--ink);
  font-family: var(--body); font-size: 15px; overflow: hidden; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
header { position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(22px, 4vw, 32px); letter-spacing: 0.1em; color: var(--gold); }
#status { margin-top: 4px; color: var(--muted); font-size: 13px; }
.bar { position: fixed; left: 0; bottom: 0; display: flex; gap: 10px; align-items: center;
  padding: 0 0 calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
button { font: inherit; font-weight: 500; color: var(--lacquer); background: var(--gold); border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
button.ghost { background: rgba(18, 8, 6, 0.6); color: var(--ink); border: 1px solid var(--gold-dim); }
button.ghost[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
#recBtn.recording { background: #b3261e; border-color: #b3261e; color: #fff; font-variant-numeric: tabular-nums; }
.bar { flex-wrap: wrap; padding-right: max(16px, env(safe-area-inset-right, 0px)) !important; }
button:disabled { opacity: 0.6; cursor: progress; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
  opacity: var(--cam-opacity, 0.6); visibility: hidden; }
body.cam-on #cam { visibility: visible; }
#stage { z-index: 1; }
header, .bar, #loading { z-index: 2; }
#opacityCtl { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 13px;
  background: rgba(18, 8, 6, 0.6); border: 1px solid var(--gold-dim); border-radius: 6px; padding: 6px 12px; }
#opacityCtl input { accent-color: var(--gold); width: 140px; }
#opacityVal { min-width: 3em; font-variant-numeric: tabular-nums; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
[hidden] { display: none !important; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage"></canvas>
<header><h1>金龍追珠</h1><div id="status">載入中…</div></header>
<div id="loading">載入金龍中…</div>
<video id="cam" playsinline muted></video>
<div class="bar">
  <button id="camBtn" type="button">開啟鏡頭（食指控制）</button>
  <button id="musicBtn" class="ghost" type="button" aria-pressed="false">音樂：關</button>
  <button id="recBtn" class="ghost" type="button">● 錄影</button>
  <label id="opacityCtl" for="opacity" hidden>背景影像 <input id="opacity" type="range" min="0" max="100" step="5" value="60"><span id="opacityVal">60%</span></label>
</div>
<script>
  (function () {
    const r = document.getElementById('opacity'), v = document.getElementById('opacityVal');
    let saved = null; try { saved = localStorage.getItem('dragonCamOpacity'); } catch (e) {}
    if (saved !== null) r.value = saved;
    const apply = () => { document.documentElement.style.setProperty('--cam-opacity', r.value / 100); v.textContent = r.value + '%';
      try { localStorage.setItem('dragonCamOpacity', r.value); } catch (e) {} };
    r.addEventListener('input', apply); apply();
  })();
</script>
<script type="module" src="dragon.js?v=202611231545"></script>
</body>
</html>
